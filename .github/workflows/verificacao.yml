name: Verificação

# Autoridade externa sobre os gates do projeto (TASK-CHORE-021, achado A1 da
# análise de 28/07/26). Antes disto, `typecheck`/`lint`/`test`/`build` eram
# declarados pelo próprio agente no mesmo markdown que ele escrevia — em 197
# tarefas concluídas não havia como um terceiro conferir. O status deste
# workflow não é controlado por ninguém dentro do repositório.

on:
  # Todas as branches: o gate precisa valer também no trabalho de preview
  # (ex.: `csp-headers`), não só na branch de produção. Sem `pull_request`
  # de propósito — projeto solo, evita run duplicado no mesmo commit.
  push:
    branches: ['**']

jobs:
  gates:
    name: Gates de qualidade
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # LTS. A máquina de desenvolvimento roda uma versão mais nova; a
          # divergência é proposital — ambiente limpo pega suposição de máquina.
          node-version: 22
          cache: npm

      # `npm ci` (não `install`): instala exatamente o lockfile e falha se ele
      # divergir do package.json. O `.npmrc` do projeto força `include=dev`,
      # garantindo as devDependencies mesmo com NODE_ENV=production.
      - name: Instalar dependências
        run: npm ci

      # ── Bloqueantes ────────────────────────────────────────────────────────
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm run test

      - name: Build
        run: npm run build

      # Auditoria de dependências de PRODUÇÃO, agora BLOQUEANTE (TASK-CHORE-024).
      #
      # Entrou informativa na TASK-CHORE-021 porque `react-router` tem advisory
      # HIGH em dependência de produção e o CI nasceria vermelho. O que faltava
      # era o `docs/seguranca/riscos-aceitos.md`: com ele, o script distingue
      # "advisory analisado, inalcançável, com prazo e responsável" de "ninguém
      # olhou" — e só o segundo caso reprova.
      #
      # Também reprova quando um risco aceito VENCE, que é o mecanismo que
      # impede exceção temporária de virar permanente.
      - name: Auditoria de dependências de produção
        run: npm run audit:prod
