name: CI

on:
  push:
  pull_request:

# Cancela execuções anteriores ainda em andamento para o mesmo ref (economiza minutos).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tipos, lint, testes e build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` instala exatamente o lockfile. O `.npmrc` do projeto tem
      # `include=dev`, então as devDependencies (vite, vitest, eslint, tsc)
      # são instaladas mesmo em ambientes com omit=dev.
      - name: Instalar dependências
        run: npm ci

      - name: Checar tipos
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
